name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }}, shard ${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Keep every test and the existing deadlines; partition files, not assertions.
      - run: npm test -- --shard=${{ matrix.shard }}/2
      - run: npm run build
      - run: npm run smoke
      - run: npm run privacy:check
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: third-brain-${{ matrix.os }}-node-${{ matrix.node }}-shard-${{ matrix.shard }}
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/LICENSE
            dist/third-brain-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
